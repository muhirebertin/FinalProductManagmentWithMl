{% extends 'base.html' %}

{% block content %}
<div class="card card-danger">
    <div class="card-header">
        <h3 class="card-title"><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h3>
    </div>
    <div class="card-body">
        <p class="lead">Are you sure you want to delete the raw material "<strong>{{ item.name }} ({{ item.code }})</strong>"?</p>
        <p class="text-danger">This action will permanently remove it from the inventory database and cannot be undone.</p>
    </div>
    <div class="card-footer">
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete Material</button>
            <a href="{% url 'inventory:material_list' %}" class="btn btn-secondary float-right">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
