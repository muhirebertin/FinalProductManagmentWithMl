{% extends 'base.html' %}

{% block content %}
<div class="card card-primary">
    <div class="card-header">
        <h3 class="card-title">{{ title }}</h3>
    </div>
    <!-- The form automatically submits to the URL that rendered it -->
    <form method="post">
        {% csrf_token %}
        <div class="card-body">
            <!-- Renders the form elements configured in forms.py -->
            {{ form.as_p }}
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-primary">Save Material</button>
            <a href="{% url 'inventory:material_list' %}" class="btn btn-default float-right">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
